# docker-compose.yml — levanta la web del proyecto.
#
#   cd web && docker compose up -d --build
#   -> http://localhost:4321
#
# La base de datos SQLite persiste en ./web/data (dentro del propio repo,
# como pide la organización del proyecto: todo junto).
#
# Despliegue futuro en psvita-ros.jcrex999.com: este mismo contenedor
# detrás de un reverse proxy (Caddy/Traefik/nginx) que termine TLS y
# apunte a :4321. Documentado en web/README.md.
services:
  web:
    build:
      context: ..            # raíz del repo: el build necesita docs/guias-vita
      dockerfile: web/Dockerfile
    image: psvita-ros-web:latest
    container_name: psvita-ros-web
    restart: unless-stopped
    # Red del HOST, como el agente micro-ROS (--net=host): en esta laptop
    # ufw tiene DEFAULT_FORWARD_POLICY=DROP, así que los puertos publicados
    # por el bridge de docker (DNAT/docker-proxy) pierden los datagramas
    # UDP que la Vita manda por la WiFi (depurado el 2026-07-07: socat en
    # el host los recibía; el mismo puerto publicado en docker, no). En
    # INPUT sí hay un allow para 192.168.1.0/24, de modo que escuchando
    # directo en el host todo llega — y además el netlog/monitor ve la IP
    # real de la Vita en vez de la del proxy (172.20.0.1). Expone 4321/tcp
    # (web) y 9999/udp (netlog) directamente en el host.
    network_mode: host
    volumes:
      - ./data:/app/web/data   # SQLite (app.db) sobrevive a los redeploys
    environment:
      - PORT=4321
      - HOST=0.0.0.0
      - DB_PATH=/app/web/data/app.db
      - TALLER_ENABLED=1
      # En este contenedor corren dos consumidores del netlog (el ingestor
      # del monitor y el backend del dashboard) pero solo puede haber UN
      # socket en el 9999: el dueño es el ingestor, y el dashboard lee las
      # líneas de la SQLite compartida (ver src/lib/netlog.ts). Sin esto
      # ambos competían por el puerto y el dashboard quedaba "inactivo".
      - NETLOG_MODE=sqlite
      # Dashboard (opcionales):
      # - NETLOG_DISABLED=1    # apagar el receptor UDP (despliegue público)
      # - NETLOG_PORT=9999
      # El puente de topics ya no ejecuta comandos docker (no funcionaba
      # dentro de este propio contenedor: sin cliente ros2 ni socket de
      # docker). Ahora es un fetch() a la API REST de zenoh-bridge-ros2dds
      # (arrancado con tools/vita-stack.sh bridge up, ver ese script y
      # web/src/lib/ros2bridge.ts). Sin ZENOH_REST_URL el widget lo indica.
      - ZENOH_REST_URL=http://192.168.1.108:8000
      # El taller (TALLER_ENABLED) NUNCA se activa en docker: necesita el
      # toolchain local del PC (toolchains/) y ejecuta procesos reales.
