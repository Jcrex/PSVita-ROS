[project]
name = "ros2-introspection-mcp"
version = "0.1.0"
description = "MCP server exposing ROS2 graph introspection to Claude Code"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2.0"]

[project.optional-dependencies]
# rclpy is NOT installed via pip; it comes from the ROS2 environment on the dev PC. Only dev/test here.
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ros2_introspection"]
