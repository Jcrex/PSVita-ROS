; Preset de exportación (G1 Unitree) para la Vita (addon psvita de godot4-vita). La plantilla la pone
; tools/export-vita-vpk.sh en addons/psvita/templates/vita_release.zip (ruta por defecto).
[preset.0]

name="PS Vita"
platform="PS Vita"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="ros/*.rsch, CREDITOS.md"
exclude_filter="addons/psvita/*, robot/mallas_g1_pc/*, robot/g1_pc.tscn"
export_path="g1-unitree.vpk"
script_export_mode=0

[preset.0.options]

data/separate_folder=false
data/folder_name="rosvitag1"
performance/capunlocker="optional"
textures/gpu_format="RGBA8888"
livearea/style="a5"
application/title="ROS2 Vita G1 Unitree"
application/title_id="RVGD40011"
application/version="01.00"
custom_template/release=""
assets/icon_128x128=""
assets/background_840x500=""
assets/startup_280x158=""
